[project]
name = "kaggle_airline_satisfaction"
version = "1.0.0"
description = "Kaggle Airline Satisfaction is a project that analyzes customer satisfaction data from airlines."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "dragon-ml-toolbox[ml]",
    "dragon-imputation>=0.2.1"
]

[dependency-groups]
dev = [
    "jupytext>=1.19.1",
]

# Jupytext configuration
[tool.jupytext]
formats = "ipynb,md"
